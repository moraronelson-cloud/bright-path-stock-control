<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bright Path Connection Test</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#18212f}
header{background:#101827;color:white;padding:28px 24px}header h1{margin:0;font-size:30px}header p{margin:7px 0 0;color:#cbd5e1}
main{max-width:680px;margin:auto;padding:28px 20px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin:16px 0}
label{display:block;font-weight:700;margin:15px 0 7px}input{width:100%;padding:14px;border:1px solid #cfd5dd;border-radius:10px;font-size:16px}
button{width:100%;padding:14px;margin-top:14px;border:0;border-radius:10px;background:#101827;color:white;font-size:16px;font-weight:700}
button.secondary{background:#e7ecf3;color:#18212f}#status{padding:14px;border-radius:10px;background:#fff3cd;margin-bottom:16px;white-space:pre-wrap}
.ok{background:#dcfce7!important;color:#166534}.bad{background:#fee2e2!important;color:#991b1b}
small{color:#64748b}code{word-break:break-all}
</style></head>
<body><header><h1>BRIGHT PATH</h1><p>Supabase connection test</p></header>
<main>
<div id="status">Starting…</div>
<div class="card"><h2>1. Connection</h2><button type="button" id="ping">Test Supabase connection</button><small>This calls the Supabase Auth endpoint directly. No CDN library is used.</small></div>
<div class="card"><h2>2. Account</h2>
<label>Email</label><input id="email" type="email" autocomplete="email">
<label>Password</label><input id="password" type="password" autocomplete="new-password">
<button type="button" id="signup">Create account</button><button type="button" id="signin" class="secondary">Sign in</button>
</div>
<div class="card"><h2>Result</h2><div id="result">Nothing sent yet.</div></div>
</main>
<script>
const BASE='https://psqirjistwghakjnymtw.supabase.co';
const KEY='sb_publishable__QvK-7cNWqUsfDkAOJiYGQ_O4Ub_vj0';
const statusEl=document.getElementById('status'), result=document.getElementById('result');
function show(msg,ok){statusEl.textContent=msg;statusEl.className=ok===true?'ok':ok===false?'bad':'';}
async function req(path,body){
  const r=await fetch(BASE+path,{method:body?'POST':'GET',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const text=await r.text(); let data; try{data=JSON.parse(text)}catch{data=text}
  if(!r.ok) throw new Error((data&&data.msg)||(data&&data.message)||(data&&data.error_description)||(data&&data.error)||('HTTP '+r.status));
  return data;
}
async function ping(){
 try{show('Testing Supabase…'); const d=await req('/auth/v1/settings'); show('Supabase reached successfully ✓',true); result.textContent='Auth endpoint responded. Connection is working.';}
 catch(e){show('Connection failed',false);result.textContent=e.message;}
}
document.getElementById('ping').onclick=ping;
document.getElementById('signup').onclick=async()=>{
 const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
 if(!email||!password){result.textContent='Enter an email and password first.';return}
 try{show('Sending signup…');const d=await req('/auth/v1/signup',{email,password});show('Signup request reached Supabase ✓',true);result.textContent=d.access_token?'Account created and signed in.':'Account created. Check the email if confirmation is required.';}
 catch(e){show('Signup reached Supabase but returned an error',false);result.textContent=e.message;}
};
document.getElementById('signin').onclick=async()=>{
 const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
 try{show('Signing in…');const d=await req('/auth/v1/token?grant_type=password',{email,password});show('Sign in successful ✓',true);result.textContent='Authenticated user: '+(d.user?.email||email);}
 catch(e){show('Sign in returned an error',false);result.textContent=e.message;}
};
ping();
</script></body></html>
