<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bright Path Stock Control</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <header class="topbar">
      <h1>BRIGHT PATH</h1>
      <p>Stock Control</p>
    </header>

    <main>
      <section class="section">
        <div class="section-head">
          <div>
            <h2>Stock Setup</h2>
            <p>Add items as you count them. A new item will appear automatically.</p>
          </div>
        </div>

        <form id="stock-setup-form">
  <div id="items-container"></div>

  <button type="submit" id="save-inventory">
    Save Inventory
  </button>
</form>
      </section>
      <section class="section">
  <div class="section-head">
    <div>
      <h2>Current Stock</h2>
      <p>Saved inventory and current quantities.</p>
    </div>
  </div>

  <div id="inventory-list"></div>
</section>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
